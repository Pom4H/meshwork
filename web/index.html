<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Meshwork GPU Worker</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #0a0a0a;
        color: #f5f5f5;
        font:
          16px system-ui,
          -apple-system,
          sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(900px, 100%);
        display: grid;
        gap: 16px;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      h1 {
        font-size: clamp(28px, 5vw, 52px);
        margin: 0;
      }
      .muted {
        color: #999;
      }
      button,
      input {
        font: inherit;
        border-radius: 10px;
        border: 1px solid #333;
        background: #151515;
        color: #fff;
        padding: 12px 14px;
      }
      button {
        cursor: pointer;
        background: #fff;
        color: #000;
        font-weight: 700;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      canvas {
        width: 100%;
        aspect-ratio: 16/9;
        background: #111;
        border: 1px solid #222;
        border-radius: 12px;
        image-rendering: auto;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        background: #111;
        border: 1px solid #222;
        border-radius: 12px;
        padding: 14px;
        min-height: 80px;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <div class="muted">Meshwork / WebGPU node</div>
        <h1>iPad render worker</h1>
      </div>
      <div class="row">
        <input id="name" value="iPad Pro M1" aria-label="Worker name" />
        <button id="start" disabled>Start worker</button>
        <span id="state" class="muted">idle</span>
      </div>
      <canvas id="preview" width="1280" height="720"></canvas>
      <pre id="log">
Open this page over HTTPS on iPadOS 26+ and tap Start worker.</pre>
    </main>
    <script type="module" src="/worker.js"></script>
  </body>
</html>
